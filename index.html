<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2f7; text-align: center; padding: 16px; margin: 0; }
    .card { background: white; padding: 18px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .btn { width: 100%; padding: 16px; margin: 6px 0; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; }
    .btn-success { background: #34c759; color: white; }
    .btn-failure { background: #ff3b30; color: white; }
    .btn-secondary { background: #8e8e93; color: white; margin-top: 10px; }
    .btn-danger { background: #ff9500; color: white; margin-top: 10px; }
    .tries { display: flex; justify-content: center; gap: 12px; font-size: 28px; margin: 12px 0; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
    select { padding: 8px 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; background: white; }
    .row { display: flex; gap: 10px; }
    .row .btn { flex: 1; }
    .filter-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .filter-btn { padding: 6px 14px; border: 1px solid #007aff; background: white; color: #007aff; border-radius: 15px; font-weight: bold; cursor: pointer; }
    .filter-btn.active { background: #007aff; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <div class="controls">
      <label for="start-level"><strong>Start Level:</strong></label>
      <select id="start-level" onchange="setInitialLevel(this.value)"></select>
    </div>
    <h1 id="level-display" style="margin: 8px 0;">Level 1</h1>
    <div style="color: #666; font-size: 14px;">Current 3-Try Round:</div>
    <div class="tries" id="tries-display">⚪ ⚪ ⚪</div>
  </div>

  <button class="btn btn-success" onclick="logTry('win')">+ SUCCESS</button>
  <button class="btn btn-failure" onclick="logTry('loss')">- FAILURE</button>

  <div class="row">
    <button class="btn btn-secondary" onclick="undo()">Undo Tap</button>
    <button class="btn btn-danger" onclick="resetApp()">Reset All</button>
  </div>

  <div class="card" style="margin-top: 16px;">
    <div class="filter-bar">
      <button class="filter-btn" id="f-10" onclick="setFilter(10)">Last 10</button>
      <button class="filter-btn active" id="f-30" onclick="setFilter(30)">Last 30</button>
      <button class="filter-btn" id="f-all" onclick="setFilter(0)">All Time</button>
    </div>
    <canvas id="progressChart"></canvas>
  </div>

  <script>
    let currentLevel = 1;
    let currentRound = [];
    let history = []; 
    let displayLimit = 30; // Default view window

    const selectEl = document.getElementById('start-level');
    for (let i = 1; i <= 15; i++) {
      let opt = document.createElement('option');
      opt.value = i;
      opt.innerText = `Level ${i}`;
      selectEl.appendChild(opt);
    }

    const ctx = document.getElementById('progressChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: 'Level', data: [], borderColor: '#007aff', backgroundColor: '#007aff', pointRadius: 3, fill: false, tension: 0.1 }] },
      options: {
        responsive: true,
        plugins: {
          tooltip: {
            callbacks: {
              title: (items) => {
                let idx = items[0].dataIndex;
                let entry = items[0].chart.data.fullHistory[idx];
                let d = new Date(entry.timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                return `Attempt #${entry.attemptNum} (${d})`;
              }
            }
          }
        },
        scales: {
          y: { min: 1, max: 15, ticks: { stepSize: 1 } },
          x: {
            ticks: {
              maxRotation: 0,
              autoSkip: true,
              maxTicksLimit: 8, // Keeps X-axis clean regardless of data size
              callback: function(val, index) {
                const rawLabel = this.getLabelForValue(val);
                return rawLabel ? rawLabel.split('\n') : '';
              }
            }
          }
        }
      }
    });

    function setFilter(limit) {
      displayLimit = limit;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (limit === 10) document.getElementById('f-10').classList.add('active');
      else if (limit === 30) document.getElementById('f-30').classList.add('active');
      else document.getElementById('f-all').classList.add('active');
      updateUI();
    }

    function setInitialLevel(val) {
      if (history.length === 0 && currentRound.length === 0) {
        currentLevel = parseInt(val);
        updateUI();
      } else if (confirm("Changing initial level will reset progress. Continue?")) {
        currentLevel = parseInt(val);
        history = [];
        currentRound = [];
        updateUI();
      } else {
        selectEl.value = currentLevel;
      }
    }

    function updateUI() {
      document.getElementById('level-display').innerText = `Level ${currentLevel}`;
      selectEl.value = currentLevel;

      let dots = currentRound.map(r => r === 'win' ? '🟢' : '🔴');
      while (dots.length < 3) dots.push('⚪');
      document.getElementById('tries-display').innerText = dots.join(' ');

      // Add attempt metadata
      let enrichedHistory = history.map((h, i) => ({ ...h, attemptNum: i + 1 }));

      // Apply view filter limit
      let visibleHistory = displayLimit > 0 ? enrichedHistory.slice(-displayLimit) : enrichedHistory;

      let labels = [];
      let levelData = [];
      let seenDates = new Set();

      visibleHistory.forEach((entry) => {
        let dateStr = new Date(entry.timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        let xLabel = `#${entry.attemptNum}`;

        // Only display date label when date transitions
        if (!seenDates.has(dateStr)) {
          seenDates.add(dateStr);
          xLabel += `\n${dateStr}`;
        }

        labels.push(xLabel);
        levelData.push(entry.level);
      });

      chart.data.labels = labels;
      chart.data.datasets[0].data = levelData;
      chart.data.fullHistory = visibleHistory; // Attach history for tooltips
      chart.update();
    }

    function logTry(result) {
      history.push({ level: currentLevel, round: [...currentRound], timestamp: new Date().toISOString() });
      currentRound.push(result);

      const wins = currentRound.filter(r => r === 'win').length;
      if (wins === 2) {
        currentLevel = Math.min(15, currentLevel + 1);
        currentRound = [];
      } else if (currentRound.length === 3) {
        if (wins === 0) currentLevel = Math.max(1, currentLevel - 1);
        currentRound = [];
      }
      updateUI();
    }

    function undo() {
      if (history.length === 0) return;
      let lastState = history.pop();
      currentLevel = lastState.level;
      currentRound = lastState.round;
      updateUI();
    }

    function resetApp() {
      if (confirm("Reset all recorded data?")) {
        currentLevel = parseInt(selectEl.value) || 1;
        currentRound = [];
        history = [];
        updateUI();
      }
    }

    updateUI();
  </script>
</body>
</html>
